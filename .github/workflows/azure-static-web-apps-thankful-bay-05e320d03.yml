name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
        id-token: write # Potrzebne do uwierzytelniania OIDC
        contents: read # Potrzebne do checkout kodu
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Kroki związane z OIDC (Get Id Token) - pozostają bez zmian
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      # Krok budowania i wdrażania z dodaną opcją skip_app_build
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_BAY_05E320D03 }} # Token API (może być potrzebny lub nie, jeśli OIDC działa)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/" # Ścieżka do kodu źródłowego (HTML/CSS) - OK
          api_location: "" # Ścieżka do API (brak) - OK
          output_location: "" # Katalog wynikowy (brak kroku budowania) - OK

          # --- DODANA LINIA ---
          skip_app_build: true # Mówi Azure, aby pominął krok budowania aplikacji

          github_id_token: ${{ steps.idtoken.outputs.result }} # Użycie OIDC - OK
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
          # Token API jest również często wymagany do zamknięcia środowiska podglądu PR
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_BAY_05E320D03 }}
